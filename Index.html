<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CampusSpace MVP</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ee;--card:#fff;--ink:#14213d;--mut:#5d6578;--line:#e0ddd2;--acc:#2a9d8f;--acc-ink:#fff;--busy:#e76f51;--cls:#c9ced9;--mine:#f4a261;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1830;--card:#182544;--ink:#f1efe8;--mut:#a9b2c8;--line:#2a3a63;--acc:#3dbdad;--acc-ink:#0f1b33;--busy:#ef8466;--cls:#3a4868;--mine:#f4a261;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1830;--card:#182544;--ink:#f1efe8;--mut:#a9b2c8;--line:#2a3a63;--acc:#3dbdad;--acc-ink:#0f1b33;--busy:#ef8466;--cls:#3a4868;--mine:#f4a261;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0}h2{font-size:18px;margin:16px 0 8px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
select,input,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
button{cursor:pointer}
nav{display:flex;gap:6px;margin:12px 0}
nav button{flex:1}
nav button.on,.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.space{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.space.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.mut{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.slot{padding:8px 4px;text-align:center;font-size:14px;border-radius:10px;border:1px solid var(--line)}
.libre{background:var(--card);cursor:pointer}.libre:hover{border-color:var(--acc)}
.clase{background:var(--cls);color:var(--mut)}.reservado{background:var(--busy);color:#0f1b33}
.mine{background:var(--mine);color:#0f1b33}.pick{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.leg span{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:middle;border:1px solid var(--line)}
.msg{padding:8px 10px;border-radius:10px;margin-top:8px}.err{background:var(--busy);color:#0f1b33}.ok{background:var(--acc);color:var(--acc-ink)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.scroll{overflow-x:auto}
</style></head><body>
<header><h1>🏫 CampusSpace</h1>
<label class="mut">Usuario: <select id="role"></select></label></header>
<p class="mut" style="margin:4px 0 0">Horario importado desde Excel. Los docentes reservan y solicitan laboratorio por sesión; Coordinación asigna manualmente el que esté libre. Los estudiantes consultan.</p>
<nav id="nav"></nav>
<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
var BLOCKS=[7,9,11,13,15,17,19],K="cs_v3",DN=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
var D=load(),S={tab:"disp",type:"Todos",date:iso(new Date()),space:null,pick:null,msg:null,mv:null,rep:null,role:"Coordinación"};
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function load(){try{var x=JSON.parse(localStorage.getItem(K));if(x&&x.classes){x.asg=x.asg||[];return x}}catch(e){}return{classes:[],spaces:[],asg:[],res:[]}}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){S.msg={e:1,t:"No se pudo guardar en este navegador."}}}
function isStu(){return S.role=="Estudiante"}function isCoord(){return S.role=="Coordinación"}
function dow(d){return new Date(d+"T12:00:00").getDay()}
function hh(h){return String(h).padStart(2,"0")+":00"}function lbl(b){return hh(b)+" - "+hh(b+2)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function profs(){var o=[];D.classes.forEach(function(c){if(o.indexOf(c.prof)<0)o.push(c.prof)});return o.sort()}
function eff(c,d){var a=D.asg.find(function(x){return x.cid==c.id&&x.date==d});return a&&a.salon?a.salon:c.salon}
function cblocks(c){return BLOCKS.filter(function(b){return b>=c.ini&&b+2<=c.fin})}
function classAt(sp,d,b){var w=dow(d);return D.classes.find(function(c){return c.dia==w&&c.desde<=d&&d<=c.hasta&&b>=c.ini&&b+2<=c.fin&&eff(c,d)==sp})}
function resAt(sp,d,b){return D.res.find(function(r){return r.space==sp&&r.date==d&&r.start==b})}
function status(sp,d,b){if(classAt(sp,d,b))return"clase";var r=resAt(sp,d,b);return r?(r.user==S.role?"mine":"reservado"):"libre"}
function freeCount(sp,d){return BLOCKS.filter(function(b){return status(sp,d,b)=="libre"}).length}
function setRoles(){var el=document.getElementById("role"),L=["Coordinación","Estudiante"].concat(profs());if(L.indexOf(S.role)<0)S.role="Coordinación";el.innerHTML=L.map(function(r){return"<option"+(r==S.role?" selected":"")+">"+esc(r)+"</option>"}).join("")}
/* ---------- Importación ---------- */
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"")}
var AL={salon:["salon","aula","espacio"],dia:["dia"],ini:["inicio","hora_inicio"],fin:["fin","hora_fin"],hor:["horario","hora"],asig:["asignatura","materia"],prof:["profesor","docente"],grupo:["grupo"],desde:["fecha_inicio","inicio_semestre"],hasta:["fecha_fin","fin_semestre"],tipo:["tipo"],cap:["capacidad"]};
function hours(v){if(typeof v=="number")return[v<1?v*24:v];var o=[],re=/(\d{1,2})(?::(\d{2}))?/g,m;while(m=re.exec(String(v)))o.push(+m[1]+(+m[2]||0)/60);return o}
function pdate(v,d0){if(typeof v=="number"&&v>20000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);var t=String(v),m=t.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");m=t.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");return d0}
function pday(v){var n=norm(v),k=["domingo","lunes","martes","miercoles","jueves","viernes","sabado"];for(var i=0;i<7;i++)if(n.length>=3&&k[i].indexOf(n.slice(0,3))==0&&k[i].indexOf(n)==0)return i;return-1}
function importRows(rows){
 var h=rows[0].map(norm),ix={},bad=[],ok=[],sp={};
 Object.keys(AL).forEach(function(k){ix[k]=h.findIndex(function(x){return AL[k].indexOf(x)>=0})});
 if(ix.salon<0||ix.dia<0||(ix.hor<0&&(ix.ini<0||ix.fin<0))||ix.asig<0||ix.prof<0)throw new Error("Faltan columnas. Se requieren: salon, dia, inicio y fin (o horario), asignatura, profesor.");
 rows.slice(1).forEach(function(r,i){
  if(r.join("").trim()=="")return;var n=i+2,salon=String(r[ix.salon]).trim(),dia=pday(r[ix.dia]),a,b;
  if(ix.ini>=0&&ix.fin>=0){a=hours(r[ix.ini])[0];b=hours(r[ix.fin])[0]}else{var q=hours(r[ix.hor]);a=q[0];b=q[1]}
  if(!salon||dia<0||isNaN(a)||isNaN(b))return bad.push("Fila "+n+": datos incompletos o inválidos.");
  if(a%1||b%1||BLOCKS.indexOf(a)<0||(b-a)%2||b<=a)return bad.push("Fila "+n+": el horario debe ir en bloques de 2 horas (7-9, 9-11, 11-13...).");
  var c={id:"c"+Date.now()+"_"+i,salon:salon,dia:dia,ini:a,fin:b,asig:String(r[ix.asig]).trim(),prof:String(r[ix.prof]).trim(),grupo:ix.grupo>=0?String(r[ix.grupo]).trim():"",desde:ix.desde>=0?pdate(r[ix.desde],"0000-01-01"):"0000-01-01",hasta:ix.hasta>=0?pdate(r[ix.hasta],"9999-12-31"):"9999-12-31"};
  if(!c.asig||!c.prof)return bad.push("Fila "+n+": falta asignatura o profesor.");
  var dup=ok.find(function(o){return o.salon==c.salon&&o.dia==c.dia&&o.ini<c.fin&&c.ini<o.fin&&o.desde<=c.hasta&&c.desde<=o.hasta});
  if(dup)return bad.push("Fila "+n+": choca con "+dup.asig+" en "+c.salon+" ("+DN[c.dia]+").");
  ok.push(c);
  if(!sp[salon]){var t=ix.tipo>=0?norm(r[ix.tipo]):"";sp[salon]={n:salon,t:(t.indexOf("comput")>=0||(!t&&/comput|lab/i.test(salon)))?"Sala de cómputo":"Aula",c:ix.cap>=0?(+r[ix.cap]||""):""}}});
 if(!ok.length)throw new Error("No se importó ninguna clase válida.");
 D.classes=ok;D.spaces=Object.keys(sp).map(function(k){return sp[k]});D.asg=[];save();
 return{n:ok.length,s:D.spaces.length,p:profs().length,bad:bad}}
function onFile(f){
 if(typeof XLSX=="undefined"){S.rep={e:1,t:"No se cargó la librería de Excel. Revisa tu conexión."};return render()}
 var fr=new FileReader();fr.onload=function(){try{var wb=XLSX.read(fr.result,{type:"array"}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""});var r=importRows(rows);S.rep={t:"Se importaron "+r.n+" clases, "+r.s+" espacios y "+r.p+" docentes.",bad:r.bad};setRoles()}catch(e){S.rep={e:1,t:e.message}}render()};fr.readAsArrayBuffer(f)}
/* ---------- Reservas y cambios de salón ---------- */
function reserve(){
 var mo=document.getElementById("mo").value.trim();if(isStu())return;
 if(!mo){S.msg={e:1,t:"Escribe la materia o el motivo."};return render()}
 var st=status(S.space,S.date,S.pick);if(st!="libre"){S.msg={e:1,t:"Conflicto: el bloque ya está "+(st=="clase"?"asignado a una clase":"reservado")+"."};return render()}
 D.res.push({id:Date.now(),space:S.space,date:S.date,start:S.pick,user:S.role,mo:mo});save();
 S.msg={t:"Reserva confirmada: "+S.space+", "+S.date+", "+lbl(S.pick)+"."};S.pick=null;render()}
function nextDate(c){var d=new Date();d.setHours(12);for(var i=0;i<7&&d.getDay()!=c.dia;i++)d.setDate(d.getDate()+1);return iso(d)}
function labsFree(c,date){return D.spaces.filter(function(s){return s.t=="Sala de cómputo"&&s.n!=c.salon&&cblocks(c).every(function(b){var o=classAt(s.n,date,b);return(!o||o.id==c.id)&&!resAt(s.n,date,b)})}).map(function(s){return s.n})}
function requestLab(cid,date){
 var c=D.classes.find(function(x){return x.id==cid});
 if(!date||dow(date)!=c.dia||date<c.desde||date>c.hasta||date<iso(new Date())){S.msg={e:1,t:"Elige una fecha futura que sea "+DN[c.dia]+" y esté dentro del semestre."};return render()}
 if(D.asg.some(function(a){return a.cid==cid&&a.date==date})){S.msg={e:1,t:"Esa sesión ya tiene una solicitud o sala asignada."};return render()}
 D.asg.push({id:Date.now(),cid:cid,date:date,salon:"",user:S.role});save();
 S.msg={t:"Solicitud enviada para el "+date+". Coordinación asignará manualmente el laboratorio disponible antes de la clase."};render()}
function reassign(id){var a=D.asg.find(function(x){return x.id==id}),el=document.getElementById("rs"+id),c=D.classes.find(function(x){return x.id==a.cid});if(!el||!el.value){S.msg={e:1,t:"No hay laboratorios libres en ese horario."};return render()}
 a.salon=el.value;save();S.msg={t:c.asig+" ("+a.date+") asignada a "+a.salon+". "+c.salon+" queda libre solo esa sesión."};render()}
function asgRow(a){var c=D.classes.find(function(x){return x.id==a.cid});if(!c)return"";var pend=!a.salon,fl=labsFree(c,a.date);
 var h='<div class="card"><b>'+(pend?"Pendiente de asignación":esc(a.salon))+'</b> · '+a.date+' · '+lbl(c.ini)+'<div class="mut">'+esc(c.asig)+(isCoord()?" · "+esc(c.prof):"")+' · salón original: '+esc(c.salon)+'</div><div class="row" style="margin-top:8px">';
  if(isCoord()){h+=fl.length?'<select id="rs'+a.id+'">'+fl.map(function(n){return"<option"+(n==a.salon?" selected":"")+">"+esc(n)+"</option>"}).join("")+'</select><button class="chip on" data-rs="'+a.id+'">'+(pend?"Asignar":"Reasignar")+'</button>':'<span class="mut">Sin laboratorios libres en ese horario.</span>'}
 return h+'<button data-ca="'+a.id+'">'+(pend?(isCoord()?"Rechazar":"Cancelar solicitud"):"Liberar")+'</button></div></div>'}
/* ---------- Vistas ---------- */
function vDisp(){
 var T=["Todos","Aula","Sala de cómputo"];
 var h='<div class="row">'+T.map(function(t){return'<button class="chip '+(S.type==t?"on":"")+'" data-type="'+t+'">'+t+'</button>'}).join("")+'</div><div class="row" style="margin-top:8px"><label class="mut">Fecha: <input type="date" id="date" value="'+S.date+'"></label></div>';
 if(!D.spaces.length)return h+'<div class="card">Aún no hay horario. '+(isCoord()?'Ve a la pestaña Importar y sube tu archivo Excel.':'Pide a Coordinación que importe el horario.')+'</div>';
 D.spaces.filter(function(s){return S.type=="Todos"||s.t==S.type}).forEach(function(s){h+='<div class="card space '+(S.space==s.n?"sel":"")+'" data-sp="'+esc(s.n)+'"><div><b>'+esc(s.n)+'</b><div class="mut">'+s.t+(s.c?" · capacidad "+s.c:"")+'</div></div><div class="mut">'+freeCount(s.n,S.date)+' de '+BLOCKS.length+' libres</div></div>'});
 if(S.space){h+='<h2>'+esc(S.space)+' · '+S.date+'</h2><div class="leg mut"><span style="background:var(--card)"></span>Libre <span style="background:var(--cls)"></span>Clase <span style="background:var(--busy)"></span>Reservado <span style="background:var(--mine)"></span>Mío</div><div class="grid" style="margin-top:8px">';
  BLOCKS.forEach(function(b){var st=status(S.space,S.date,b),c=(S.pick===b&&st=="libre")?"pick":st;h+='<div class="slot '+c+'" data-h="'+b+'"><b>'+lbl(b)+'</b><br><span style="font-size:12px">'+({libre:"Libre",clase:"Clase",reservado:"Reservado",mine:"Mío",pick:"Libre"}[c])+'</span></div>'});h+='</div>';
  if(S.pick!==null){var st2=status(S.space,S.date,S.pick),r=resAt(S.space,S.date,S.pick),c=classAt(S.space,S.date,S.pick);
   if(c)h+='<div class="card"><b>'+esc(c.asig)+'</b><div class="mut">'+esc(c.prof)+(c.grupo?" · Grupo "+esc(c.grupo):"")+(c.salon!=S.space?" · movida desde "+esc(c.salon):"")+'</div></div>';
   else if(r)h+='<div class="card">Reservado por <b>'+esc(r.user)+'</b>: '+esc(r.mo)+'</div>';
   else if(isStu())h+='<div class="card">Bloque libre. Solo los docentes pueden reservar.</div>';
   else h+='<div class="card"><b>Reservar '+lbl(S.pick)+'</b><div class="row" style="margin-top:8px"><input id="mo" placeholder="Materia o motivo" style="flex:1;min-width:160px"><button id="go" class="chip on">Reservar</button></div></div>'}}
 else h+='<p class="mut">Elige un espacio para ver sus bloques.</p>';
 return h+(S.msg?'<div class="msg '+(S.msg.e?"err":"ok")+'">'+esc(S.msg.t)+'</div>':"")}
function vClases(){
 var today=iso(new Date()),up=D.asg.filter(function(a){return a.date>=today}).sort(function(a,b){return(a.salon?1:0)-(b.salon?1:0)||(a.date<b.date?-1:1)}),h='';
 if(isCoord())h+='<h2>Solicitudes y asignaciones</h2>'+(up.length?up.map(asgRow).join(""):'<p class="mut">Sin asignaciones próximas.</p>');
 var L=D.classes.filter(function(c){return isCoord()||c.prof==S.role});
 h+='<h2>'+(isCoord()?"Clases del semestre":"Mis clases")+'</h2><p class="mut">Si tu clase necesita laboratorio, solicítalo para esa fecha. No eliges la sala: Coordinación asigna manualmente la que esté libre minutos antes de la clase. La asignación vale solo para esa sesión y el salón original queda libre.</p>';
 if(!L.length)h+='<p class="mut">No hay clases.</p>';
 L.forEach(function(c){h+='<div class="card"><b>'+esc(c.asig)+'</b><div class="mut">'+DN[c.dia]+' '+hh(c.ini)+'-'+hh(c.fin)+' · '+esc(c.salon)+(c.grupo?" · "+esc(c.grupo):"")+(isCoord()?" · "+esc(c.prof):"")+'</div>';
  if(!isCoord())up.filter(function(a){return a.cid==c.id}).forEach(function(a){h+=asgRow(a)});
  h+='<div class="row" style="margin-top:8px"><input type="date" id="rd'+c.id+'" value="'+nextDate(c)+'"><button class="chip on" data-rq="'+c.id+'">Solicitar laboratorio</button></div></div>'});
 return h+(S.msg?'<div class="msg '+(S.msg.e?"err":"ok")+'">'+esc(S.msg.t)+'</div>':"")}
function vMis(){
 var L=D.res.filter(function(r){return isCoord()||r.user==S.role}).sort(function(a,b){return(a.date+a.start)<(b.date+b.start)?-1:1}),h='<h2>'+(isCoord()?"Todas las reservas":"Mis reservas")+'</h2>';
 if(!L.length)return h+'<p class="mut">Aún no hay reservas.</p>';
 L.forEach(function(r){h+='<div class="card row" style="justify-content:space-between"><div><b>'+esc(r.space)+'</b><div class="mut">'+r.date+' · '+lbl(r.start)+' · '+esc(r.mo)+(isCoord()?" · "+esc(r.user):"")+'</div></div><button data-del="'+r.id+'">Cancelar</button></div>'});return h}
function vImp(){
 var h='<h2>Importar horario (Excel)</h2><div class="card"><input type="file" id="file" accept=".xlsx,.xls,.csv"><p class="mut">Una fila por sesión de clase. Columnas: <b>salon, dia, inicio, fin</b> (o <b>horario</b> como 7:00-9:00), <b>asignatura, profesor</b>; opcionales: <b>grupo, tipo</b> (Aula o Sala de cómputo)<b>, capacidad, fecha_inicio, fecha_fin</b>. Bloques de 2 horas. Al importar se reemplaza el horario y se borran las asignaciones de salas.</p></div>';
 if(S.rep){h+='<div class="msg '+(S.rep.e?"err":"ok")+'">'+esc(S.rep.t)+'</div>';if(S.rep.bad&&S.rep.bad.length)h+='<div class="card"><b>'+S.rep.bad.length+' fila(s) omitida(s)</b>'+S.rep.bad.slice(0,8).map(function(x){return'<div class="mut">'+esc(x)+'</div>'}).join("")+'</div>'}
 h+='<div class="card">Horario guardado: <b>'+D.classes.length+'</b> clases en <b>'+D.spaces.length+'</b> espacios. <button data-clr="1" style="margin-left:8px">Borrar horario</button></div>';return h}
function vAna(){
 var h='<h2>Uso de espacios</h2><p class="mut">Bloques reservados por espacio (además de las clases).</p>',mx=1,rows=D.spaces.map(function(s){var x=D.res.filter(function(r){return r.space==s.n}).length;if(x>mx)mx=x;return{s:s,x:x}});
 rows.forEach(function(o){h+='<div class="card"><div class="row" style="justify-content:space-between"><b>'+esc(o.s.n)+'</b><span class="mut">'+o.x+' reservas</span></div><div class="bar"><i style="width:'+Math.round(o.x/mx*100)+'%"></i></div></div>'});return h}
function render(){
 var tabs=[["disp","Disponibilidad"]];
 var np=D.asg.filter(function(x){return!x.salon}).length;if(!isStu())tabs.push(["cl",isCoord()?"Clases"+(np?" ("+np+")":""):"Mis clases"],["mis",isCoord()?"Reservas":"Mis reservas"]);
 if(isCoord())tabs.push(["imp","Importar"],["ana","Analítica"]);
 if(!tabs.some(function(t){return t[0]==S.tab}))S.tab="disp";
 document.getElementById("nav").innerHTML=tabs.map(function(t){return'<button data-t="'+t[0]+'" class="'+(S.tab==t[0]?"on":"")+'">'+t[1]+'</button>'}).join("");
 document.getElementById("app").innerHTML={disp:vDisp,cl:vClases,mis:vMis,imp:vImp,ana:vAna}[S.tab]()}
document.addEventListener("click",function(e){var t=e.target.closest("[data-t],[data-type],[data-sp],[data-h],[data-del],[data-rq],[data-ca],[data-rs],[data-clr],#go");if(!t)return;var d=t.dataset;
 if(d.t){S.tab=d.t;S.msg=null}else if(d.type)S.type=d.type;
 else if(d.sp!==undefined){S.space=d.sp;S.pick=null;S.msg=null}
 else if(d.h){S.pick=+d.h;S.msg=null}
 else if(d.del){D.res=D.res.filter(function(r){return r.id!=d.del});save()}
 else if(d.rq)return requestLab(d.rq,document.getElementById("rd"+d.rq).value);
 else if(d.ca){D.asg=D.asg.filter(function(a){return a.id!=d.ca});save();S.msg={t:"Asignación cancelada."}}
